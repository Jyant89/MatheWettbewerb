function ds(head,rows,ops,ans){
  let h=`<div class="ds"><div class="ds-h">${head[0]}</div><div></div><div class="ds-h">${head[1]}</div>`;
  rows.forEach((r,i)=>{const cls=i===rows.length-1?"ds-res":i===1?"ds-one":"";
    h+=`<div class="ds-c ${cls}">${r[0]}</div><div class="ds-ar">→</div><div class="ds-c ${cls}">${r[1]}</div>`;
    if(i<ops.length)h+=`<div class="ds-op">↓ ${ops[i][0]}</div><div></div><div class="ds-op">↓ ${ops[i][1]}</div>`});
  return h+`</div>`+(ans?`<p class="hk-ans"><b>Antwort:</b> ${ans}</p>`:"")}
function chain(u,f){let h=`<div class="chain">`;u.forEach((x,i)=>{h+=`<span class="ch-u">${x}</span>`;if(i<f.length)h+=`<span class="ch-f"><span class="fw">· ${f[i]}</span><span class="fw">⟶</span><span class="bw">⟵</span><span class="bw">: ${f[i]}</span></span>`});return h+`</div>`}
function folge(n,d){let h=`<div class="folge">`;n.forEach((x,i)=>{h+=`<span class="fo-n ${x==="?"?"q":""}">${x}</span>`;if(i<d.length)h+=`<span class="fo-d">${d[i]}</span>`});return h+`</div>`}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r3=x=>Math.round(x*1000)/1000;
const fmt=x=>r3(x).toLocaleString("de-DE",{maximumFractionDigits:3,useGrouping:false}).replace("-","−");
const fmtE=x=>(Math.round(x*100)/100).toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:false});
const pct=x=>x==null?"–":Math.round(x*100)+" %";
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dDE=s=>{const[y,m,d]=s.split("-");return d+"."+m+"."};
function relClass(w){const q=w/WMAX;return q>.8?"r4":q>.6?"r3":q>.4?"r2":q>.2?"r1":"r0"}
function compClass(c){return c==null?"c-none":c>=.75?"c-good":c>=.5?"c-mid":"c-low"}
function compWord(c){return c==null?"keine Daten":c>=.75?"beherrscht":c>=.5?"weiter üben":"Wiederholung nötig"}
function prio(t,c){return Math.round(100*(T[t].w/WMAX)*(1-(c==null?.5:c)))}

function demoData(){
  let seed=7;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const days=["2026-10-26","2026-10-27","2026-10-28","2026-10-29","2026-10-30"];
  const hard={G:.15,E:.2,B:-.05,P:-.2,Z:-.15,W:0,F:0,K:-.1,S:.15,D:.2,M:-.2};
  const out=[];
  S.students.forEach((s,i)=>{const base=.35+R()*.5;
    days.forEach((day,di)=>{const k=TOPICS[(i+di*3)%11].id;const k2=TOPICS[(i*2+di)%11].id;
      [k,k2].forEach(t=>{let p=Math.max(0,Math.min(1,base+hard[t]+(R()-.5)*.3+di*.03));
        const lvl=p>.75?3:p>.5?2:1;out.push({s,t,kind:"uebung",lvl,ok:Math.round(p*5),n:5,day,ts:Date.parse(day)+di})})});
  });return out;
}
function data(){return S.results.length?S.results:S.demo}
function isDemo(){return !S.results.length}
function effScore(r){return r.kind==="uebung"?(r.ok/r.n)*(LVF[r.lvl]||.9):Math.max(0,Math.min(1,r.pct/100))}
function compSeries(rs){/* gleitender Mittelwert: neuere Ergebnisse zählen mehr, Tests stärker als Übungen */
  let c=null;const ser=[];rs.slice().sort((a,b)=>a.ts-b.ts).forEach(r=>{const x=effScore(r);const a=r.kind==="uebung"?.4:.6;c=c==null?x:c*(1-a)+x*a;ser.push({day:r.day,c})});return ser}
function comp(s,t,upto){const rs=data().filter(r=>r.s===s&&r.t===t&&(!upto||r.day<=upto));if(!rs.length)return null;const ser=compSeries(rs);return ser[ser.length-1].c}

/* ============ 7. Unterrichtsplan-Algorithmus ============ */
function buildPlan(){
  const used=new Set(Object.values(S.done).filter(x=>MODS[x]));
  const P={};TOPICS.forEach(t=>{const c=classComp(t.id);P[t.id]=(t.w/WMAX)*(1-(c==null?.5:c))});
  Object.values(S.done).forEach(id=>{if(MODS[id])P[MODS[id].t]*=.45});
  const plan=[];
  for(let i=1;i<=NSLOTS;i++){
    if(SIMS[i]){plan.push({i,sim:true});continue}
    if(S.done[i]&&MODS[S.done[i]]){plan.push({i,mod:S.done[i],locked:true});continue}
    let best=null;TOPICS.forEach(t=>{if(!MOD.some(m=>m.t===t.id&&!used.has(m.id)))return;if(!best||P[t.id]>P[best])best=t.id});
    if(!best){plan.push({i,mod:null});continue}
    const m=MOD.find(x=>x.t===best&&!used.has(x.id));used.add(m.id);P[best]*=.45;plan.push({i,mod:m.id});
  }
  return plan;
}

let view="klasse",selStudent=null,quiz=null;
function route(){const h=location.hash.slice(1);const allowed=S.teacher?VIEWS.map(v=>v[0]):["ueben","daten"];view=allowed.includes(h)?h:(S.teacher?"klasse":"ueben");render()}
function tabs(){const pv=$("#pv");if(pv)pv.innerHTML=S.isTeacher?`<button class="small ${S.preview?"primary":""}" id="previewBtn">${S.preview?"Zur Lehreransicht":"Als Schüler testen"}</button>`:"";const list=S.teacher?VIEWS:VIEWS.filter(v=>v[0]==="ueben"||v[0]==="daten");$("#tabs").innerHTML=list.map(([k,n])=>`<a href="#${k}" ${k===view?'aria-current="page"':""}>${n}</a>`).join("")}
function countdown(){const now=new Date();const d=Math.ceil((new Date(2026,11,4)-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/864e5);
  const done=Object.keys(S.done).length;$("#countdown").innerHTML=d>=0?`<strong>noch ${d} Tage</strong>${S.teacher?`Stunde ${Math.min(done+1,NSLOTS)} von ${NSLOTS}`:""}`:"<strong>Wettbewerb vorbei</strong>"}
function demoBanner(){if(!isDemo())return"";return `<div class="banner"><b>Beispieldaten.</b> Noch keine echten Ergebnisse gespeichert. Die Werte unten sind erfunden und zeigen nur, wie die Heatmap aussieht. Sobald die erste Übung oder Lernzielkontrolle eingetragen ist, rechnet die Heatmap nur noch mit echten Daten.</div>`}
function storeBanner(){if(S.db)return S.stale?`<div class="banner">Die gespeicherten Daten sind gerade nicht erreichbar. Angezeigt wird der letzte Stand.</div>`:"";return `<div class="banner">Speichern ist in dieser Ansicht nicht möglich. Öffne die Seite in claude.ai, damit Ergebnisse dauerhaft gespeichert werden.</div>`}
function legend(){return `<div class="legend"><span class="label">Lernstand</span><span><i class="c-good"></i>ab 75 % beherrscht</span><span><i class="c-mid"></i>50–74 % weiter üben</span><span><i class="c-low"></i>unter 50 % Wiederholung</span><span><i class="c-none"></i>keine Daten</span><span class="label" style="margin-left:8px">Wettbewerbsgewicht</span><span><i class="r1"></i>gering</span><span><i class="r2"></i></span><span><i class="r3"></i></span><span><i class="r4"></i>hoch</span></div>`}
function spark(vals,w=90,h=24){if(vals.length<2)return `<span class="note">${vals.length?"1 Messung":"–"}</span>`;const xs=i=>2+i*(w-6)/(vals.length-1),ys=v=>h-3-v*(h-6);
  const pts=vals.map((v,i)=>`${xs(i)},${ys(v)}`).join(" ");const last=vals[vals.length-1];
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><line x1="0" x2="${w}" y1="${ys(.75)}" y2="${ys(.75)}" stroke="var(--good)" stroke-dasharray="2 3" stroke-width=".8"/><line x1="0" x2="${w}" y1="${ys(.5)}" y2="${ys(.5)}" stroke="var(--low)" stroke-dasharray="2 3" stroke-width=".8"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6"/><circle cx="${xs(vals.length-1)}" cy="${ys(last)}" r="2.6" fill="var(--accent)"/></svg>`}

function vKlasse(){
  const cc=Object.fromEntries(TOPICS.map(t=>[t.id,classComp(t.id)]));
  const byPrio=TOPICS.map(t=>({t,c:cc[t.id],p:prio(t.id,cc[t.id])})).sort((a,b)=>b.p-a.p);
  const byW=TOPICS.slice().sort((a,b)=>b.w-a.w).slice(0,3);
  const sp=REAL().map(s=>{const pr=studentPrios(s);const vals=pr.filter(x=>x.c!=null);const avg=vals.length?vals.reduce((a,x)=>a+x.c,0)/vals.length:null;const reds=vals.filter(x=>x.c<.5).length;const mp=pr.reduce((a,x)=>a+x.p,0)/pr.length;return{s,avg,reds,mp,n:vals.length}}).filter(x=>x.n>0);
  const foerder=sp.slice().sort((a,b)=>b.mp-a.mp).filter(x=>x.reds>=2||x.avg<.5).slice(0,6);
  const joint=TOPICS.map(t=>{const v=REAL().map(s=>comp(s,t.id)).filter(x=>x!=null);const low=v.filter(x=>x<.6).length;return{t,share:v.length?low/v.length:0,n:v.length,low}}).filter(x=>x.n>=3&&x.share>=.5).sort((a,b)=>b.share*b.t.w-a.share*a.t.w);
  const head=TOPICS.map(t=>`<th class="top" title="${esc(t.name)}">${esc(t.name.split(" ")[0])}</th>`).join("");
  const relrow=TOPICS.map(t=>`<td class="cell"><span class="${relClass(t.w)}" title="Wettbewerbsgewicht ${pct(t.w)}">${(t.w*100).toFixed(1).replace(".",",")}</span></td>`).join("");
  const avgrow=TOPICS.map(t=>`<td class="cell"><span class="${compClass(cc[t.id])}">${pct(cc[t.id])}</span></td>`).join("");
  const rows=S.students.map(s=>`<tr class="stud" data-s="${esc(s)}"><td class="name">${esc(s)}${s===TESTK?' <span class="tag">Test</span>':""}</td>${TOPICS.map(t=>{const c=comp(s,t.id);return `<td class="cell"><span class="${compClass(c)}" title="${esc(s)} · ${esc(t.name)}: ${compWord(c)}">${c==null?"·":Math.round(c*100)}</span></td>`}).join("")}</tr>`).join("");
  return `<div class="stack">${demoBanner()}${storeBanner()}
  <div><h1>Klassen-Heatmap</h1><p class="lead">Oben steht, wie stark jedes Thema im Wettbewerb vorkommt (blau). Darunter steht, wie gut die Klasse es kann (Ampel). Beides ist getrennt. Ein wichtiges Thema ist nicht automatisch ein schwaches.</p></div>
  <div class="grid4">
   <div class="sheet kpi"><span class="label">Größte Lernbaustellen</span>${byPrio.slice(0,3).map(x=>`<div><span class="big">${esc(x.t.name)}</span><br><span class="note">Priorität ${x.p} · Klasse ${pct(x.c)} · Gewicht ${pct(x.t.w)}</span></div>`).join("")}</div>
   <div class="sheet kpi"><span class="label">Höchstes Wettbewerbsgewicht</span>${byW.map(t=>`<div><span class="big">${esc(t.name)}</span><br><span class="note">${t.ta} Teilaufgaben · ${pct(t.w)} · in ${t.years} von 5 Jahren</span></div>`).join("")}</div>
   <div class="sheet kpi"><span class="label">Besonderer Förderbedarf</span>${foerder.length?foerder.map(x=>`<div><a href="#schueler" data-go="${esc(x.s)}" class="mono" style="font-weight:600;color:var(--accent)">${esc(x.s)}</a> <span class="note">Ø ${pct(x.avg)} · ${x.reds} rote Themen</span></div>`).join(""):`<p class="note">Niemand mit zwei oder mehr roten Themen.</p>`}</div>
   <div class="sheet kpi"><span class="label">Gemeinsame Wiederholung sinnvoll</span>${joint.length?joint.slice(0,4).map(x=>`<div><span class="big">${esc(x.t.name)}</span><br><span class="note">${x.low} von ${x.n} SuS unter 60 %</span></div>`).join(""):`<p class="note">Kein Thema, bei dem die Hälfte der Klasse unter 60 % liegt.</p>`}</div>
  </div>
  <div class="sheet stack"><div class="row" style="justify-content:space-between"><h2>Lernstand je Schüler und Thema</h2><span class="note">Zeile anklicken öffnet die Schüler-Heatmap</span></div>${legend()}
   <div class="tablewrap"><table class="heat"><thead><tr><th>Kürzel</th>${head}</tr></thead><tbody>
   <tr class="relrow"><td class="note">Gewicht %</td>${relrow}</tr><tr class="relrow"><td class="note">Klasse Ø</td>${avgrow}</tr>${rows}</tbody></table></div></div>
  </div>`}

function vSchueler(){
  if(!selStudent||!S.students.includes(selStudent))selStudent=S.students[0];
  const s=selStudent;const pr=studentPrios(s);
  const rs=data().filter(r=>r.s===s);const days=[...new Set(rs.map(r=>r.day))].sort();
  const overall=days.map(d=>{const v=TOPICS.map(t=>comp(s,t.id,d)).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0});
  const opts=S.students.map(x=>`<option ${x===s?"selected":""}>${esc(x)}</option>`).join("");
  const rows=pr.map(x=>{const t=T[x.t];const ser=compSeries(rs.filter(r=>r.t===x.t)).map(o=>o.c);const need=x.c==null?"unbekannt":x.c<.5?"groß":x.c<.75?"mittel":"gering";
   return `<tr><td><b>${esc(t.name)}</b><br><span class="note">${esc(t.sub)}</span></td>
   <td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="relbar" style="width:90px"><i style="width:${t.w/WMAX*100}%"></i></div><span class="mono note">${pct(t.w)}</span></div><span class="note">Relevanz ${relWord(t.w)}</span></td>
   <td><span class="chip ${compClass(x.c)}">${pct(x.c)}</span><br><span class="note">Lernbedarf ${need}</span></td>
   <td class="num"><span class="prio"><i style="width:${x.p*.6}px"></i>${x.p}</span></td>
   <td>${spark(ser)}</td><td><span class="tag">${LV_NAME[levelFor(x.c)]}</span></td></tr>`}).join("");
  const next=pr.slice(0,3);
  return `<div class="stack">${demoBanner()}
  <div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Schüler-Heatmap</h1><p class="lead">Priorität = Wettbewerbsgewicht (relativ zum stärksten Thema) × (100 % − Kompetenz). Ohne Daten rechnet die Heatmap vorläufig mit 50 %.</p></div>
  <label class="f" for="selS">Kürzel<select id="selS">${opts}</select></label></div>
  <div class="grid2">
   <div class="sheet stack"><span class="label">Nächste Übungen für ${esc(s)}</span>${next.map((x,i)=>`<div class="row" style="justify-content:space-between"><div><b>${i+1}. ${esc(T[x.t].name)}</b><br><span class="note">${LV_NAME[levelFor(x.c)]} · Priorität ${x.p}</span></div><button class="small" data-quiz="${x.t}" data-lvl="${levelFor(x.c)}" data-s="${esc(s)}">Übung starten</button></div>`).join("")}</div>
   <div class="sheet stack"><span class="label">Entwicklung über die Übungstage (Ø aller geübten Themen)</span>${days.length>=2?trendSVG(days,overall):`<p class="note">Der Verlauf erscheint ab dem zweiten Übungstag.</p>`}</div>
  </div>
  <div class="sheet stack">${legend()}<div class="tablewrap"><table><thead><tr><th>Thema</th><th>Wettbewerbsgewicht</th><th>Kompetenz</th><th class="num">Priorität</th><th>Verlauf</th><th>Empfohlenes Niveau</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  </div>`}
function trendSVG(days,vals){const W=420,H=150,l=34,r=10,t=10,b=26;const x=i=>l+i*(W-l-r)/(days.length-1),y=v=>t+(1-v)*(H-t-b);
 let g="";[0,.25,.5,.75,1].forEach(v=>{g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+3}" text-anchor="end">${v*100}</text>`});
 g+=`<rect x="${l}" y="${y(1)}" width="${W-l-r}" height="${y(.75)-y(1)}" fill="var(--good-bg)" opacity=".5"/>`;
 const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");g+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(vals.length-1)},${y(0)}" fill="var(--rel1)" opacity=".6"/><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
 vals.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===vals.length-1?4:2.5}" fill="var(--accent)"/>`;if(days.length<=8||i%2===0)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${dDE(days[i])}</text>`});
 return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img" aria-label="Kompetenz in Prozent je Übungstag">${g}</svg></div>`}

function vPlan(){
  const plan=buildPlan();
  const groups=t=>{const g={1:[],2:[],3:[]};REAL().forEach(s=>{const c=comp(s,t);g[levelFor(c)].push(s+(c==null?"?":""))});return `<div class="groups">${[1,2,3].map(l=>`<span><span class="label">N${l}</span> <b>${g[l].length?g[l].map(esc).join(", "):"–"}</b></span>`).join("")}</div>`};
  const slots=plan.map(p=>{const wk=Math.ceil(p.i/4);const done=S.done[p.i]!=null;
   const btn=S.db?`<button class="small" data-done="${p.i}" data-mod="${p.mod||"sim"}">${done?"Als offen markieren":"Stunde gehalten"}</button>`:"";
   if(p.sim){const s=SIMS[p.i];return `<div class="slot ${done?"done":""}"><div class="nr"><b>${p.i}</b>Woche ${wk}<br>${WEEKS[wk-1]}</div><div class="body"><div class="row"><span class="tag sim">${p.i===1?"Diagnose":p.i===20?"Abschluss":"Simulation"}</span>${done?'<span class="tag">gehalten</span>':""}</div><h3>${esc(s.title)}</h3><p><b>Lernziel:</b> ${esc(s.ziel)}</p>${s.map?`<p class="note">Themen-Zuordnung zum Eintragen: <span class="mono">${esc(s.map)}</span></p>`:""}<ul class="list">${s.ab.map(a=>`<li>${esc(a)}</li>`).join("")}</ul><div class="row">${btn}</div></div></div>`}
   if(!p.mod)return `<div class="slot"><div class="nr"><b>${p.i}</b>Woche ${wk}</div><div class="body"><p class="note">Freie Übungsstunde: Jede/r arbeitet im Reiter „Üben“ an den eigenen Top-3-Themen.</p></div></div>`;
   const m=MODS[p.mod],t=T[m.t];const cc=classComp(m.t);
   return `<div class="slot ${done?"done":""}"><div class="nr"><b>${p.i}</b>Woche ${wk}<br>${WEEKS[wk-1]}</div><div class="body">
    <div class="row"><span class="chip ${relClass(t.w)}">${esc(t.name)}</span><span class="chip ${compClass(cc)}">Klasse ${pct(cc)}</span>${done?'<span class="tag">gehalten</span>':""}</div>
    <h3>${esc(m.title)}</h3><p><b>Lernziel:</b> ${esc(m.ziel)}</p>
    <ul class="list">${m.ab.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>
    <details><summary>Übungsaufgaben in drei Niveaus mit Lösungen</summary>${m.t==="D"?barSVG(DDAYS,DCHART):""}<div class="lv">${[1,2,3].map(l=>`<div><h4>${LV_NAME[l]}</h4><ol>${m.a[l].map(([q,s])=>`<li>${esc(q)}<br><span class="sol">Lösung: ${esc(s)}</span></li>`).join("")}</ol></div>`).join("")}</div></details>
    <details><summary>Hilfekarte mit Beispiel</summary>${hilfeCard(m.t)}</details>
    <details><summary>Gruppen nach Lernstand</summary>${groups(m.t)}<p class="note">? = noch keine Daten, vorläufig Niveau 2.</p></details>
    <div class="row">${btn}<button class="small" data-quizclass="${m.t}">Online-Übung öffnen</button></div></div></div>`}).join("");
  return `<div class="stack">${demoBanner()}
  <div><h1>Unterrichtsplan bis zum 04.12.2026</h1><p class="lead">20 Stunden (4 pro Woche, 02.11. bis 03.12.). Feste Termine: Diagnose, drei Simulationen mit echten Vorjahresheften, Generalprobe, Fehleranalyse. Die übrigen 14 Stunden verteilt der Algorithmus nach Klassen-Priorität: Er nimmt immer das Thema mit der höchsten Priorität und halbiert sie danach ungefähr, damit kein Thema alles belegt. Gehaltene Stunden bleiben fest, die offenen ordnen sich nach jedem neuen Ergebnis neu.</p></div>
  ${S.db?"":`<p class="note">„Stunde gehalten“ ist nur verfügbar, wenn die Seite speichern kann.</p>`}
  <div class="sheet">${slots}</div></div>`}

function vAnalyse(){
  const rows=TOPICS.slice().sort((a,b)=>b.ta-a.ta).map(t=>`<tr><td><b>${esc(t.name)}</b><br><span class="note">${esc(t.sub)}</span></td>
   ${t.y.map((v,i)=>`<td class="cell yearcell"><span class="chip ${v===0?"r0":v>=6?"r4":v>=4?"r3":v>=2?"r2":"r1"}" style="min-width:34px">${v}</span></td>`).join("")}
   <td class="num"><b>${t.ta}</b></td><td><div class="stackbar" title="Pflicht ${t.pf}, Wahl ${t.wa}"><span class="p" style="width:${t.pf/t.ta*100}%"></span><span class="w" style="width:${t.wa/t.ta*100}%"></span></div><span class="note mono">${t.pf} P · ${t.wa} W</span></td>
   <td class="num">${(t.w*100).toFixed(1).replace(".",",")} %</td><td class="num">${t.years}/5</td><td class="num">${"●".repeat(Math.round(t.diff))}${t.diff%1?"◐":""}</td></tr>`).join("");
  const types=TYPES.slice().sort((a,b)=>b[2]-a[2]).map(x=>`<tr><td>${esc(x[0])}</td><td><span class="chip ${relClass(T[x[1]].w)}">${esc(T[x[1]].name)}</span></td><td>${x[3]}</td><td class="num">${x[2]}/5</td></tr>`).join("");
  return `<div class="stack">
  <div><h1>Wettbewerbsanalyse Gruppe C</h1><p class="lead">Ausgezählt aus den Aufgabenheften 2020/21, 2022/23, 2023/24, 2024/25 und 2025/26 (jeweils 1. Runde, nur Aufgabengruppe C). Insgesamt ${TOTAL} Teilaufgaben.</p></div>
  <div class="banner info"><b>So ist gezählt.</b> Die Hefte enthalten keine Punktzahlen. Jede Teilaufgabe (a, b, c …) zählt deshalb als eine Einheit. Mischaufgaben (z. B. Käse-Preisliste, Busfahrplan) sind dem Hauptthema zugeordnet. Der Schwierigkeitsgrad ist eine Einschätzung der Seite, keine offizielle Angabe. Im Wahlteil werden seit 2022/23 zwei von vier Aufgaben gewertet, 2020/21 nur eine.</div>
  <div class="sheet stack"><h2>Themen je Wettbewerbsjahr</h2><div class="tablewrap"><table><thead><tr><th>Thema</th>${YEARS.map(y=>`<th class="num">${y}</th>`).join("")}<th class="num">Summe</th><th>Pflicht / Wahl</th><th class="num">Anteil</th><th class="num">Jahre</th><th class="num">Schwierigkeit</th></tr></thead>
  <tbody>${rows}<tr><td class="note">Teilaufgaben je Heft</td>${YEARTOT.map(v=>`<td class="num">${v}</td>`).join("")}<td class="num"><b>${TOTAL}</b></td><td colspan="4"></td></tr></tbody></table></div>
  <p class="note">Pflicht = 89 Teilaufgaben, Wahl = 88. Der Pflichtteil prüft Grundlagen (Rechnen, Einheiten, Diagramme, Fläche). Der Wahlteil besteht fast nur aus Prozent, Dreisatz, Konstruktion und Folgen. ● leicht · ●● mittel · ●●● schwer.</p></div>
  <div class="sheet stack"><h2>Wiederkehrende Aufgabentypen</h2><div class="tablewrap"><table><thead><tr><th>Aufgabentyp</th><th>Thema</th><th>Teil</th><th class="num">Häufigkeit</th></tr></thead><tbody>${types}</tbody></table></div>
  <p class="note">Jedes Jahr gibt es im Wahlteil eine Prozent-Sachaufgabe, eine Dreisatz-/Einkaufsaufgabe und eine Konstruktionsaufgabe. Wer diese drei sicher kann, hat immer zwei passende Wahlaufgaben.</p></div>
  </div>`}

function vUeben(){
  const me=(()=>{try{return localStorage.getItem("wh-me")}catch(e){return null}})();
  const s=quiz?.s||(S.students.includes(me)?me:S.students[0]);
  const opts=S.students.map(x=>`<option ${x===s?"selected":""}>${esc(x)}</option>`).join("");
  const pr=studentPrios(s).slice(0,3);
  let qhtml="";
  if(quiz){qhtml=`<div class="sheet stack"><div class="row" style="justify-content:space-between"><div><span class="label">${esc(quiz.s)} · ${esc(T[quiz.t].name)}</span><h2>${LV_NAME[quiz.lvl]}</h2></div><button class="small" id="hilfeBtn">Hilfekarte</button></div>
   <div id="hilfe" hidden>${hilfeCard(quiz.t)}</div>
   <div>${quiz.qs.map((q,i)=>`<div class="q"><span class="n">${i+1}</span><div><div>${q.q}</div><div class="ans">${q.type==="mc"?`<div class="mc">${q.opts.map(o=>`<button data-mc="${i}" data-v="${o}" aria-pressed="${quiz.ans[i]===o}" ${quiz.checked?"disabled":""}>${o}</button>`).join("")}</div>`:`<input id="a${i}" inputmode="decimal" autocomplete="off" aria-label="Antwort ${i+1}" value="${esc(quiz.ans[i]||"")}" ${quiz.checked?"disabled":""}>${q.unit?`<span>${esc(q.unit)}</span>`:""}`}</div>
   ${quiz.checked?`<p class="fb">${quiz.res[i]?'<span class="ok">Richtig.</span>':'<span class="no">Noch nicht.</span>'} ${esc(q.sol)}</p>`:""}</div></div>`).join("")}</div>
   <div class="row">${quiz.checked?`<b>${quiz.res.filter(Boolean).length} von ${quiz.qs.length} richtig.</b> <span class="note">${quiz.test?"Testzugang: nicht gespeichert.":quiz.saved?"Gespeichert. Die Heatmap ist aktualisiert.":S.db?"Wird gespeichert …":"Nicht gespeichert (keine Verbindung)."}</span><button class="primary" data-quiz="${quiz.t}" data-lvl="${quiz.lvl}" data-s="${esc(quiz.s)}">Neue Runde</button><button id="quizEnd">Fertig</button>`:`<button class="primary" id="check">Prüfen</button>`}</div></div>`}
  return `<div class="stack">
  <div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1>Üben für den Wettbewerb</h1><p class="lead">Wähle dein Kürzel. Jede Runde hat 5 Aufgaben im Stil des Wettbewerbs. Dein Ergebnis aktualisiert die Heatmap.</p></div>
  <label class="f" for="meS">Mein Kürzel<select id="meS">${opts}</select></label></div>
  ${quiz?qhtml:`<div class="sheet stack"><span class="label">Für dich empfohlen</span><div class="grid4">${pr.map((x,i)=>`<div class="stack" style="gap:6px"><b>${i+1}. ${esc(T[x.t].name)}</b><span class="note">${LV_NAME[levelFor(x.c)]}</span><button class="primary small" data-quiz="${x.t}" data-lvl="${levelFor(x.c)}" data-s="${esc(s)}">Starten</button></div>`).join("")}</div></div>
  <div class="sheet stack"><span class="label">Selbst wählen</span><div class="tablewrap"><table><thead><tr><th>Thema</th><th>Niveau 1</th><th>Niveau 2</th><th>Niveau 3</th></tr></thead><tbody>${TOPICS.map(t=>`<tr><td><b>${esc(t.name)}</b><br><span class="note">${esc(t.sub)}</span></td>${[1,2,3].map(l=>`<td><button class="small" data-quiz="${t.id}" data-lvl="${l}" data-s="${esc(s)}">N${l}</button></td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="note">Konstruktionen zeichnest du auf Papier. Hier übst du das Rechnen dazu. Die Lehrkraft trägt deine Zeichnung als Lernzielkontrolle ein.</p></div>`}
  </div>`}

const ICON={G:"+ −",E:"m → cm",B:"¾",P:"%",Z:"1 → 5",W:"∠",F:"▭",K:"△",S:"⇋",D:"▮▯▮",M:"1 2 3"};
let entry={s:null,t:null,n:null,ok:null,saved:false};
function vDaten(){
  const me=(()=>{try{return localStorage.getItem("wh-me")}catch(e){return null}})();
  if(!entry.s&&S.students.includes(me))entry.s=me;
  const step=(nr,title,done,body)=>`<div class="sheet stack step ${done?"is-done":""}"><div class="row"><span class="stepnr">${nr}</span><h2>${title}</h2></div>${body}</div>`;
  let html="";
  if(entry.saved){
    html=`<div class="sheet stack bigmsg"><p class="huge">✓ ${entry.test?"Test – nicht gespeichert":"Gespeichert"}</p><p><b>${esc(entry.s)}</b> · ${esc(T[entry.t].name)} · Niveau ${entry.lvl} · <b>${entry.ok} von 3</b> richtig</p>
    <div class="row"><button class="primary big" data-e="again">Noch ein Ergebnis</button><button class="big" data-e="reset">Fertig</button></div></div>`;
  } else {
    html+=step(1,"Wer bist du?",entry.s,`<div class="pick">${S.students.map(s=>`<button class="big mono" data-e="s" data-v="${esc(s)}" aria-pressed="${entry.s===s}">${esc(s)}</button>`).join("")}</div>`);
    if(entry.s)html+=step(2,"Welches Thema?",entry.t,`<div class="pick topics">${TOPICS.map(t=>`<button class="big topic" data-e="t" data-v="${t.id}" aria-pressed="${entry.t===t.id}"><span class="ic">${ICON[t.id]}</span>${esc(t.name)}</button>`).join("")}</div>`);
    if(entry.t)html+=step(3,"Welches Niveau hast du bearbeitet?",entry.lvl,`<div class="pick">${[[1,"Niveau 1","Basis"],[2,"Niveau 2","Wettbewerb"],[3,"Niveau 3","Expert"]].map(([l,a,b])=>`<button class="big topic" data-e="lvl" data-v="${l}" aria-pressed="${entry.lvl===l}"><span class="ic">${"★".repeat(l)}</span>${a} · ${b}</button>`).join("")}</div>`);
    if(entry.lvl)html+=step(4,"Wie viele von den 3 Aufgaben waren richtig?",entry.ok!=null,`<div class="pick">${[0,1,2,3].map(i=>`<button class="big num" data-e="ok" data-v="${i}" aria-pressed="${entry.ok===i}">${i}</button>`).join("")}</div>`);
    if(entry.ok!=null)html+=`<div class="row"><button class="primary big" data-e="save" ${S.db||S.preview?"":"disabled"}>Speichern</button><button class="big" data-e="reset">Neu anfangen</button>${S.db?"":`<span class="note">Speichern geht nur in claude.ai.</span>`}</div>`;
  }
  return `<div class="stack">${storeBanner()}
  <div><h1>Ergebnis eintragen</h1><p class="lead">Tippe Schritt für Schritt an.</p></div>
  ${html}
  ${S.teacher?teacherData():""}</div>`}
function teacherData(){
  const opts=S.students.map(x=>`<option>${esc(x)}</option>`).join("");
  const recent=S.results.slice().sort((a,b)=>b.ts-a.ts).slice(0,25);
  return `<details class="teach"><summary>Für die Lehrkraft: Tests, Import, Kürzel, Einträge</summary><div class="stack" style="margin-top:12px">
   <form class="sheet stack" id="simForm"><h2>Simulation oder Lernzielkontrolle</h2>
    <div class="row"><label class="f" for="fS">Kürzel<select id="fS">${opts}</select></label><label class="f" for="fK">Art<select id="fK"><option value="lzk">Lernzielkontrolle</option><option value="sim">Simulation</option></select></label><label class="f" for="fD">Datum<input id="fD" type="date" value="${today()}"></label></div>
    <p class="note">Prozent je Thema. Leere Felder werden übersprungen.</p>
    <div class="grid4" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${TOPICS.map(t=>`<label class="f" for="fp${t.id}">${esc(t.name)}<input id="fp${t.id}" inputmode="numeric" placeholder="%"></label>`).join("")}</div>
    <div class="row"><button class="primary" type="submit" ${S.db?"":"disabled"}>Speichern</button><span class="note" id="simMsg"></span></div></form>
   <form class="sheet stack" id="csvForm"><h2>Import aus der Lernwebseite (CSV)</h2>
    <p class="note">Eine Zeile pro Ergebnis: <span class="mono">Kürzel;Thema;Prozent;Datum;Art</span>. Thema als Buchstabe (${TOPICS.map(t=>t.id).join(", ")}) oder Name. Art: Übung, LZK oder Simulation.</p>
    <textarea id="csv" placeholder="S04;P;65;2026-11-05;Übung&#10;S04;Z;80;2026-11-05;LZK"></textarea>
    <div class="row"><button class="primary" type="submit" ${S.db?"":"disabled"}>Importieren</button><span class="note" id="csvMsg"></span></div></form>
   <form class="sheet stack" id="stuForm"><h2>Kürzel der Klasse</h2><p class="note">Durch Komma getrennt. Keine echten Namen.</p><input id="stuList" value="${esc(S.students.join(", "))}"><div class="row"><button type="submit" ${S.db?"":"disabled"}>Liste speichern</button><span class="note" id="stuMsg"></span></div></form>
   <div class="sheet stack"><h2>Letzte Einträge</h2>${recent.length?`<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Kürzel</th><th>Thema</th><th>Art</th><th class="num">Ergebnis</th><th></th></tr></thead><tbody>${recent.map(r=>`<tr><td class="mono">${dDE(r.day)}</td><td class="mono">${esc(r.s)}</td><td>${esc(T[r.t]?.name||r.t)}</td><td>${r.kind==="uebung"?"Übung N"+r.lvl:r.kind==="sim"?"Simulation":"LZK"}</td><td class="num">${r.kind==="uebung"?r.ok+"/"+r.n:r.pct+" %"}</td><td><button class="small" data-del="${esc(r.id)}">Löschen</button></td></tr>`).join("")}</tbody></table></div>`:`<p class="note">Noch keine Einträge.</p>`}</div>
   <div class="sheet stack"><h2>So rechnet die Heatmap</h2><ul class="list">
    <li><b>Wettbewerbsgewicht</b> = Teilaufgaben des Themas : ${TOTAL}. Ändert sich nicht durch Schülerdaten.</li>
    <li><b>Kompetenz</b> = gleitender Mittelwert der Ergebnisse. Neuere zählen mehr. Tests (60 %) stärker als Übungen (40 %).</li>
    <li>Übungen nach Niveau: N1 höchstens 70 %, N2 höchstens 90 %, N3 bis 100 %. Selbst eingetragene Ergebnisse beziehen sich auf die 3 Aufgaben je Niveau aus dem Unterrichtsplan.</li>
    <li><b>Priorität</b> = (Gewicht : höchstes Gewicht) × (1 − Kompetenz) × 100. Ohne Daten gilt 50 %.</li></ul></div>
  </div></details>`}
async function entryClick(b){const e=b.dataset.e,v=b.dataset.v;
  if(e==="s"){entry={s:v,t:null,n:null,ok:null,saved:false};try{localStorage.setItem("wh-me",v)}catch(_){}}
  else if(e==="t"){entry.t=v;entry.lvl=null;entry.n=null;entry.ok=null}
  else if(e==="lvl"){entry.lvl=+v;entry.n=3;entry.ok=null}
  else if(e==="ok"){entry.ok=+v}
  else if(e==="reset"){entry={s:entry.s,t:null,n:null,ok:null,saved:false}}
  else if(e==="again"){entry={s:entry.s,t:null,n:null,ok:null,saved:false}}
  else if(e==="save"&&S.preview){entry.saved=true;entry.test=true}
  else if(e==="save"){b.disabled=true;try{await S.db.collection("results").add({s:entry.s,t:entry.t,kind:"uebung",lvl:entry.lvl,ok:entry.ok,n:3,day:today(),ts:Date.now(),src:"selbst"});entry.saved=true}catch(err){toast("Speichern hat nicht geklappt. Sag deiner Lehrkraft Bescheid.");b.disabled=false;return}}
  render();const last=[...document.querySelectorAll(".step")].pop();if(last&&e!=="save")last.scrollIntoView({behavior:"smooth",block:"nearest"})}

function render(){tabs();countdown();
  const html={klasse:vKlasse,schueler:vSchueler,plan:vPlan,analyse:vAnalyse,ueben:vUeben,daten:vDaten}[view]();$("#app").innerHTML=(S.preview?`<div class="banner info row" style="margin-bottom:16px"><span><b>Testzugang Schüler.</b> So sehen deine SuS die Seite. Im Test wird nichts gespeichert.</span><button class="small" id="previewOff">Zur Lehreransicht</button></div>`:"")+html;
  const sel=$("#selS");if(sel)sel.onchange=e=>{selStudent=e.target.value;render()};
  const me=$("#meS");if(me)me.onchange=e=>{try{localStorage.setItem("wh-me",e.target.value)}catch(_){}quiz=null;render()};
  bindForms();
}

/* ============ 9. Interaktion ============ */
function startQuiz(t,lvl,s){const qs=[];let guard=0;while(qs.length<5&&guard++<50){const q=GEN[t](lvl);if(!qs.some(x=>x.q===q.q))qs.push(q)}quiz={t,lvl:+lvl,s,qs,ans:[],checked:false,res:[],saved:false};try{localStorage.setItem("wh-me",s)}catch(_){}location.hash="#ueben";if(view==="ueben")render();window.scrollTo(0,0)}
function parseAns(v){if(v==null)return NaN;let x=String(v).trim().replace(/[−–]/g,"-").replace(/[^\d,.\-\/]/g,"");if(x.includes("/")){const[a,b]=x.split("/").map(Number);return b?a/b:NaN}
  if(/^-?\d{1,3}(\.\d{3})+$/.test(x))x=x.replace(/\./g,"");else if(x.includes(","))x=x.replace(/\./g,"").replace(",",".");return x===""?NaN:Number(x)}
async function checkQuiz(){quiz.qs.forEach((q,i)=>{if(q.type!=="mc"){const el=$("#a"+i);quiz.ans[i]=el?el.value:""}});
  quiz.res=quiz.qs.map((q,i)=>q.type==="mc"?quiz.ans[i]===q.a:Math.abs(parseAns(quiz.ans[i])-q.a)<1e-6);quiz.checked=true;render();
  const ok=quiz.res.filter(Boolean).length;const rec={s:quiz.s,t:quiz.t,kind:"uebung",lvl:quiz.lvl,ok,n:quiz.qs.length,day:today(),ts:Date.now()};
  if(S.preview){quiz.saved=true;quiz.test=true}else if(S.db){try{await S.db.collection("results").add(rec);quiz.saved=true}catch(e){toast(e.code==="quota_exceeded"?"Speicher voll. Bitte alte Einträge löschen.":"Speichern fehlgeschlagen. Ergebnis bitte notieren.")}}else{S.results.push({...rec,id:"local"+Date.now()})}
  render()}
document.addEventListener("click",async e=>{const b=e.target.closest("button,a,tr.stud");if(!b)return;
  if(b.id==="previewBtn"||b.id==="previewOff"){S.preview=!S.preview;S.teacher=S.isTeacher&&!S.preview;quiz=null;location.hash=S.preview?"#ueben":"#klasse";route();window.scrollTo(0,0);return}
  if(b.dataset.e){entryClick(b);return}
  if(b.dataset.quiz){startQuiz(b.dataset.quiz,b.dataset.lvl,b.dataset.s);return}
  if(b.dataset.quizclass){const t=b.dataset.quizclass;startQuiz(t,2,S.students[0]);return}
  if(b.dataset.mc!=null){quiz.ans[+b.dataset.mc]=b.dataset.v;b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
  if(b.id==="check"){checkQuiz();return}
  if(b.id==="quizEnd"){quiz=null;render();return}
  if(b.id==="hilfeBtn"){const h=$("#hilfe");h.hidden=!h.hidden;return}
  if(b.dataset.go){selStudent=b.dataset.go}
  if(b.matches("tr.stud")){selStudent=b.dataset.s;location.hash="#schueler";return}
  if(b.dataset.done){const i=b.dataset.done;const d={...S.done};if(d[i]!=null)delete d[i];else d[i]=b.dataset.mod;try{await S.db.doc("config/plan").set({done:d});}catch(err){toast("Nur die Lehrkraft kann den Plan ändern.")}return}
  if(b.dataset.del){try{await S.db.doc("results/"+b.dataset.del).delete();toast("Gelöscht.")}catch(err){toast("Löschen nicht möglich.")}return}
});
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function bindForms(){
  const sf=$("#simForm");if(sf)sf.onsubmit=async e=>{e.preventDefault();const s=$("#fS").value,kind=$("#fK").value,day=$("#fD").value||today();let n=0;
    for(const t of TOPICS){const v=$("#fp"+t.id).value.trim();if(!v)continue;const p=parseAns(v);if(isNaN(p)||p<0||p>100){$("#simMsg").textContent=`${t.name}: bitte eine Zahl von 0 bis 100.`;return}
      try{await S.db.collection("results").add({s,t:t.id,kind,pct:p,day,ts:Date.parse(day)+43200000+n});n++}catch(err){$("#simMsg").textContent="Speichern fehlgeschlagen.";return}}
    toast(n?`${n} Ergebnis(se) für ${s} gespeichert.`:"Keine Werte eingetragen.")};
  const cf=$("#csvForm");if(cf)cf.onsubmit=async e=>{e.preventDefault();const lines=$("#csv").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);let ok=0,bad=[];
    for(const [k,l] of lines.entries()){const c=l.split(/[;\t]/).map(x=>x.trim());const s=c[0];let t=(c[1]||"").toUpperCase();if(!T[t]){const f=TOPICS.find(x=>x.name.toLowerCase().startsWith((c[1]||"").toLowerCase())&&c[1]);t=f?f.id:null}
      const p=parseAns(c[2]);const day=/^\d{4}-\d{2}-\d{2}$/.test(c[3]||"")?c[3]:today();const a=(c[4]||"").toLowerCase();const kind=a.startsWith("sim")?"sim":a.startsWith("lzk")||a.startsWith("test")?"lzk":"import";
      if(!s||!t||isNaN(p)||p<0||p>100){bad.push(k+1);continue}
      try{await S.db.collection("results").add(kind==="import"?{s,t,kind:"lzk",pct:p,day,ts:Date.parse(day)+ok,src:"uebung-import"}:{s,t,kind,pct:p,day,ts:Date.parse(day)+ok});ok++}catch(err){bad.push(k+1)}}
    $("#csvMsg").textContent=`${ok} importiert.${bad.length?` Fehler in Zeile ${bad.join(", ")}.`:""}`};
  const st=$("#stuForm");if(st)st.onsubmit=async e=>{e.preventDefault();const list=[...new Set($("#stuList").value.split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean))].slice(0,40);
    try{await S.db.doc("config/klasse").set({students:list});$("#stuMsg").textContent="Gespeichert."}catch(err){$("#stuMsg").textContent="Nur die Lehrkraft kann die Liste ändern."}};
}
window.addEventListener("hashchange",route);

/* ============ 10. Start ============ */
S.demo=demoData();route();
(async()=>{
  if(!window.claude?.use){return}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(user){try{const ed=await user.canEdit();const own=await user.isOwner();S.isTeacher=!!(ed||own);S.teacher=S.isTeacher&&!S.preview}catch(_){}}
  if(!db){route();return}
  S.db=db;
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  db.collection("results").onSnapshot(snap=>{if(!snap.metadata.fromCache){clearTimeout(timer);S.stale=false}
    S.results=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.s&&r.t&&T[r.t]);
    if(quiz&&quiz.checked&&!quiz.saved){/* noop */}
    if(!(view==="ueben"&&quiz&&!quiz.checked)&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))render()},
    err=>{clearTimeout(timer);S.stale=true;render()});
  db.doc("config/klasse").onSnapshot(s=>{const d=s.data();if(d&&Array.isArray(d.students)&&d.students.length){S.students=withTest(d.students.map(String));S.demo=demoData()}if(!(quiz&&!quiz.checked))render()},()=>{});
  db.doc("config/plan").onSnapshot(s=>{const d=s.data();S.done=(d&&d.done)||{};if(!(quiz&&!quiz.checked))render()},()=>{});
  route();
})();
</script>

</body></html>
